<script>
fetchCategories().then((cats) => {
    const ul = document.getElementById("sitemap-cats");
    (cats || []).forEach((c, i) => ul.insertAdjacentHTML("beforeend", `<li><span class="n">${String(i + 1).padStart(2, "0")}</span><a class="link-arrow" href="products.html?category=${encodeURIComponent(c.slug)}">${UPVC.esc(c.name)}</a></li>`));
});
</script>
